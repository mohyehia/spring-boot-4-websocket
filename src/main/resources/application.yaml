spring:
  application:
    name: spring-boot-4-websocket

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Below is just for testing
jwt:
  secret-key: my_application_super_super_secret_key

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.web.socket.messaging.StompSubProtocolHandler: trace
    org.springframework.web.socket.sockjs.transport: debug

server:
  shutdown: graceful