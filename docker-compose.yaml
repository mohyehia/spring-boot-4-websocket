services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_PASS: secret
      RABBITMQ_DEFAULT_USER: user
#      RABBITMQ_PLUGINS: rabbitmq_stomp,rabbitmq_web_stomp,rabbitmq_management
    ports:
      # AMQP protocol
      - "5672:5672"
      # Management UI
      - "15672:15672"
      # STOMP protocol (TCP)
      - "61613:61613"
      # Web STOMP (WebSockets)
      - "15674:15674"
    volumes:
      - ./volumes/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins

